<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Outer Glow Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-dasharray="700 300" stroke-linecap="round" opacity="0.85" filter="url(#shadow)" />

  <!-- Core AI Copilot Symbol -->
  <g transform="translate(136, 136)">
    <!-- Bot Head Contour -->
    <rect x="32" y="48" width="176" height="144" rx="40" fill="url(#glowGrad)" opacity="0.1" />
    <path d="M 48 48 C 48 24, 192 24, 192 48 L 192 144 C 192 176, 48 176, 48 144 Z" fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" filter="url(#shadow)"/>

    <!-- Antenna Spark -->
    <path d="M 120 12 L 120 32" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="120" cy="10" r="8" fill="url(#accentGrad)"/>

    <!-- Glowing Eyes -->
    <circle cx="88" cy="96" r="16" fill="url(#accentGrad)"/>
    <circle cx="152" cy="96" r="16" fill="url(#accentGrad)"/>

    <!-- Smile Wave -->
    <path d="M 96 136 Q 120 152 144 136" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Floating Sparkles -->
    <path d="M 210 20 L 216 32 L 228 38 L 216 44 L 210 56 L 204 44 L 192 38 L 204 32 Z" fill="url(#accentGrad)"/>
    <path d="M 30 180 L 34 188 L 42 192 L 34 196 L 30 204 L 26 196 L 18 192 L 26 188 Z" fill="url(#glowGrad)"/>
  </g>
</svg>
