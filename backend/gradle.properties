# ---------------------------------------------------------------------------
# Gradle 构建性能优化
# ---------------------------------------------------------------------------

# 开启配置缓存：跳过重复配置的耗时阶段，显著缩短「无源码变更的重复构建」时长。
# Gradle 9.x 下配置缓存已稳定；首次开启若有 task 不兼容，构建会报错并指出
# 不兼容点（见下方 org.gradle.configuration-cache.problems 设置），按提示修复即可。
org.gradle.configuration-cache=true
# 遇到配置缓存不兼容时，在控制台报告而非直接失败，便于本地发现并修复问题。
org.gradle.configuration-cache.problems=warn

# 开启构建缓存（含本地缓存，远程缓存需额外配置 buildCache 块）：
# 复用 task 输出（如编译结果、资源处理），避免重复执行。
org.gradle.caching=true

# 配套的常规性能开关（与上面两项协同，进一步缩短构建时间）。
org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC

# 使用 Kotlin/Java 守护进程，减少重复构建的 JVM 冷启动开销。
org.gradle.daemon=true
