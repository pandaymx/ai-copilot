server:
  port: ${SERVER_PORT:${PORT:8084}}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:ai-copilot-backend}   # 出现在 trace 的 resource 中，便于在 Tempo 区分服务
  config:
    import:
      - optional:file:.env[.properties] # 让 Spring 原生将 .env 解析为 properties 读取
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      lifecycle-management: start-only
      readiness:
        wait: always
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_copilot}
    username: ${POSTGRES_USER:ai}
    password: ${POSTGRES_PASSWORD:ai}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:20000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:3000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:2000ms}
  # WebFlux 编解码器内存上限：STT 以 base64 JSON 上传音频（约 33% 膨胀），
  # 单次录音上限 60s，16MB 足以覆盖，避免大音频体被拒或 OOM。
  codec:
    max-in-memory-size: 16MB
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:${SPRING_AI_DEEPSEEK_API_KEY:your_deepseek_api_key_here}}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-chat}
    openai:
      api-key: ${OPENAI_API_KEY:${SPRING_AI_OPENAI_API_KEY:your_openai_api_key_here}}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        model: ${OPENAI_MODEL:gpt-4o}
      # TTS 文本转语音：复用 Spring AI OpenAI audio 模块，但 base-url 指向 Gemini 的
      # OpenAI 兼容端口，model 使用 gemini-3.1-flash-tts-preview。该配置独立于全局
      # spring.ai.openai.base-url，因此不影响上方 gpt-4o 聊天链路。
      audio:
        speech:
          base-url: ${TTS_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
          api-key: ${GEMINI_API_KEY:${SPRING_AI_GOOGLE_GENAI_API_KEY:your_gemini_api_key_here}}
          model: ${TTS_MODEL:gemini-3.1-flash-tts-preview}
          voice: ${TTS_VOICE:alloy}
          response-format: mp3
          speed: 1.0
    google:
      genai:
        api-key: ${GEMINI_API_KEY:${SPRING_AI_GOOGLE_GENAI_API_KEY:your_gemini_api_key_here}}
        chat:
          model: ${GEMINI_MODEL:gemini-3.6-flash}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:${SPRING_AI_ANTHROPIC_API_KEY:your_anthropic_api_key_here}}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      chat:
        model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
    # 会话记忆表（spring_ai_chat_memory）交由 JDBC 记忆 starter 在启动时自动建表；
    # 向量表（ai_long_term_memory）由 pgvector starter 自动建（含 CREATE EXTENSION IF NOT EXISTS vector）。
    chat:
      # Spring AI 可观测性开关（observation 默认开启；显式声明，敏感内容默认不导出）
      client:
        observations:
          log-prompt: false
          log-completion: false
        tool-search-advisor:
          enabled: ${SPRING_AI_TOOL_SEARCH_ADVISOR_ENABLED:${TOOL_SEARCH_ADVISOR_ENABLED:false}}
          tool-index-type: ${SPRING_AI_TOOL_INDEX_TYPE:${TOOL_INDEX_TYPE:regex}}
          min-tools-threshold: ${SPRING_AI_MIN_TOOLS_THRESHOLD:${MIN_TOOLS_THRESHOLD:30}}
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: true
      memory:
        repository:
          jdbc:
            initialize-schema: always
    # ---------------------------------------------------------------------
    # MCP Client（消费侧）：自动发现并暴露远程 MCP server 提供的工具。
    # 默认关闭（enabled:false），不连接任何 server，不影响现有无 MCP 启动。
    # 开启某个 server 后，其工具由 spring-ai-starter-mcp-client 自动装配为
    # SyncMcpToolCallbackProvider bean，并在 ChatService 中合并注入 Agent 路径。
    # ---------------------------------------------------------------------
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:false}        # MCP 总开关；true 时才会连接下方已 enabled 的 server
        name: ${MCP_CLIENT_NAME:ai-copilot-mcp-client}
        type: SYNC                                  # SYNC/ASYNC；本服务统一用同步回调（SyncMcpToolCallbackProvider）
        request-timeout: ${MCP_CLIENT_REQUEST_TIMEOUT:30s}
        # 多个 server 出现同名工具时，由 DefaultMcpToolNamePrefixGenerator 自动加
        # <serverName>_ 前缀避免冲突，无需额外编码。
        # ---- SSE（HTTP）连接：spring.ai.mcp.client.sse.connections.<name> ----
        sse:
          connections:
            # 官方参考 SSE server 示例（默认关闭）
            # websearch:
            #   url: ${MCP_SSE_WEBSEARCH_URL:http://localhost:8081}
            #   enabled: ${MCP_SSE_WEBSEARCH_ENABLED:false}
            # server1:
            #   url: http://localhost:9000
            #   enabled: true
        # ---- stdio 连接：spring.ai.mcp.client.stdio.servers[]（严格数组） ----
        stdio:
          servers:
            # filesystem：本地文件系统读写（npx 拉起 @modelcontextprotocol/server-filesystem）
            # - name: filesystem
            #   command: npx
            #   args:
            #     - "-y"
            #     - "@modelcontextprotocol/server-filesystem"
            #     - "/path/to/allowed/dir"
            #   enabled: false
            # github：仓库操作（需 GITHUB_PERSONAL_ACCESS_TOKEN 环境变量透传给子进程）
            # - name: github
            #   command: npx
            #   args:
            #     - "-y"
            #     - "@modelcontextprotocol/server-github"
            #   env:
            #     GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:your_github_token_here}
            #   enabled: false
            # slack：工作区消息（需 SLACK_BOT_TOKEN / SLACK_TEAM_ID）
            # - name: slack
            #   command: npx
            #   args:
            #     - "-y"
            #     - "@modelcontextprotocol/server-slack"
            #   env:
            #     SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:your_slack_bot_token_here}
            #     SLACK_TEAM_ID: ${SLACK_TEAM_ID:your_slack_team_id_here}
            #   enabled: false

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        # embedding 由 configured embedding model 提供；会话消息与长期记忆共用同一 pg 实例

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  prometheus:
    metrics:
      export:
        enabled: true
  # ---- OpenTelemetry / Tracing ----
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # 默认全采样，便于观察 ChatClient/Advisor 链路
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://otel-collector:4318}  # OTLP/HTTP；gRPC 用 :4317
      export:
        timeout: 5s
    metrics:
      export:
        enabled: false   # metrics 仍走现有 /actuator/prometheus 直采，不重复经 otel-collector
  # 资源属性（出现在 trace 的 resource 中，便于在 Tempo 区分服务）


# =====================================================================
# 多模型供应商统一抽象层配置（本模块）
# 与上方 spring.ai.* 解耦：spring.ai.* 负责一等公民的连接与自动装配，
# 这里仅补充展示元数据、上下文预算，并完整描述二等公民。
# =====================================================================
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}  # 生产环境收敛为具体域名列表，如 http://localhost:3000,https://app.yourdomain.com
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}  # 放行 X-User-Id 等自定义头

  auth:  # 受信任 Header 身份认证（不引入 Spring Security，认证由前置网关处理）
    mode: ${AUTH_MODE:strict}           # strict=默认安全(fail-closed)，dev=本地开发可 fallback 到请求体 userId
    header-name: ${AUTH_HEADER_NAME:X-User-Id}

  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:deepseek}
    default-model: ${AI_DEFAULT_MODEL:deepseek-chat}
    system-prompt: "你是一个专业、友好且可靠的 AI 助手。"

    context:
      reserve-output-tokens: 2048        # 为模型输出预留的 token 数
      history-ratio: 0.7                 # 历史消息可占用的上下文预算比例（0~1]
      default-max-context-tokens: 32768  # 模型未声明 maxContextTokens 时的兜底值
      safety-factor: 1.1                 # Token 估算安全系数，>1 表示高估

    agent:
      enabled: ${AGENT_ENABLED:true}
      max-tool-calls: ${MAX_TOOL_CALLS:5}
      timeout-seconds: ${TIMEOUT_SECONDS:30}
      tool-search-advisor:
        enabled: ${TOOL_SEARCH_ADVISOR_ENABLED:false}
        tool-index-type: ${TOOL_INDEX_TYPE:regex}        # regex | lucene | vector
        min-tools-threshold: ${MIN_TOOLS_THRESHOLD:30}  # 工具总数 >= 30 时开启渐进式检索过滤

    # 一等公民：仅需声明「对外暴露哪些模型」及展示元数据。
    # 连接参数（apiKey/baseUrl）仍由上方 spring.ai.* 管理，未配置密钥时由 starter 行为决定。
    first-class:
      deepseek:
        display-name: DeepSeek
        models:
          - id: deepseek-chat
            name: deepseek-chat
            display-name: DeepSeek Chat
            description: DeepSeek 通用对话模型
            badge: 推荐
            tags: [chat]
            max-context-tokens: 32768
            default: true
            input-price-per-k: 0.0010
            output-price-per-k: 0.0020
      openai:
        display-name: OpenAI
        models:
          - id: gpt-4o
            name: gpt-4o
            display-name: GPT-4o
            description: OpenAI 多模态旗舰模型
            tags: [multimodal]
            max-context-tokens: 128000
            default: true
            input-price-per-k: 0.0180
            output-price-per-k: 0.0720
      google:
        display-name: Google Gemini
        models:
          - id: gemini-3.6-flash
            name: gemini-3.6-flash
            display-name: Gemini 3.6 Flash
            description: Google 轻量高速多模态模型（新版）
            tags: [multimodal]
            max-context-tokens: 1048576
            default: true
            input-price-per-k: 0.0005
            output-price-per-k: 0.0020
          - id: gemini-3.5-flash
            name: gemini-3.5-flash
            display-name: Gemini 3.5 Flash
            description: Google 轻量高速多模态模型
            tags: [multimodal]
            max-context-tokens: 1048576
            input-price-per-k: 0.0005
            output-price-per-k: 0.0020
          - id: gemini-3.5-flash-lite
            name: gemini-3.5-flash-lite
            display-name: Gemini 3.5 Flash Lite
            description: Google 轻量低成本多模态模型
            tags: [multimodal]
            max-context-tokens: 1048576
            input-price-per-k: 0.0002
            output-price-per-k: 0.0008
          - id: gemini-3.1-pro-preview
            name: gemini-3.1-pro-preview
            display-name: Gemini 3.1 Pro Preview
            description: Google 旗舰多模态模型预览版
            tags: [multimodal]
            max-context-tokens: 2097152
            input-price-per-k: 0.0090
            output-price-per-k: 0.0360
          - id: gemini-3.1-flash-lite
            name: gemini-3.1-flash-lite
            display-name: Gemini 3.1 Flash Lite
            description: Google 轻量低成本多模态模型
            tags: [multimodal]
            max-context-tokens: 1048576
            input-price-per-k: 0.0002
            output-price-per-k: 0.0008
          - id: gemma-4-26b-a4b-it
            name: gemma-4-26b-a4b-it
            display-name: Gemma 4 26B
            description: Google 开源轻量模型
            tags: [open-source]
            max-context-tokens: 262144
            input-price-per-k: 0.0000
            output-price-per-k: 0.0000
          - id: gemma-4-31b-it
            name: gemma-4-31b-it
            display-name: Gemma 4 31B
            description: Google 开源模型
            tags: [open-source]
            max-context-tokens: 262144
            input-price-per-k: 0.0000
            output-price-per-k: 0.0000
      ollama:
        display-name: Ollama (本地)
        models:
          - id: llama3
            name: llama3
            display-name: Llama 3
            description: 本地运行的开源模型，无需联网密钥
            tags: [local]
            max-context-tokens: 8192
            default: true
            input-price-per-k: 0.0000
            output-price-per-k: 0.0000
      anthropic:
        display-name: Anthropic Claude
        models:
          - id: claude-sonnet-4
            name: claude-sonnet-4-20250514
            display-name: Claude Sonnet 4
            description: Anthropic 旗舰对话模型
            tags: [chat]
            max-context-tokens: 200000
            default: true
            input-price-per-k: 0.0215
            output-price-per-k: 0.1075

    # RAG 文档多源解析与检索管道配置（独立 pgvector 表 ai_rag_documents，与长期记忆物理隔离）
    rag:
      enabled: ${AI_RAG_ENABLED:false}                          # RAG 总开关；关闭时 RagAdvisor 不挂接对话链路
      top-k: ${AI_RAG_TOP_K:4}                                  # 文档相似检索 Top-K
      chunk-size: ${AI_RAG_CHUNK_SIZE:900}                      # Token 切片大小（TokenTextSplitter chunks）
      overlap: ${AI_RAG_OVERLAP:180}                            # 相邻切片重叠 Token 数（≈ 20% chunk-size）
      encoding-type: ${AI_RAG_ENCODING:CL100K_BASE}             # TokenTextSplitter 分词编码（CL100K_BASE/P50K_BASE/O200K_BASE）
      collection-name: ${AI_RAG_COLLECTION:ai_rag_documents}    # 独立 pgvector 表名
      hybrid-search-enabled: ${AI_RAG_HYBRID_SEARCH:true}       # 混合检索开关（向量 + tsvector 全文双路召回 + RRF 融合）
      rerank-enabled: ${AI_RAG_RERANK_ENABLED:false}            # Rerank 精排开关
      extraction-enabled: ${AI_RAG_EXTRACTION_ENABLED:true}     # 结构化抽取开关（文档入库时自动 LLM 结构化抽取）
      rrf-k: ${AI_RAG_RRF_K:60}                                 # RRF 倒数排名融合平滑常数 K
      candidate-pool-multiplier: ${AI_RAG_CANDIDATE_MULTIPLIER:3} # 双路召回候选池放大倍数（topK * multiplier）
      ssrf:
        timeout-seconds: ${AI_RAG_SSRF_TIMEOUT:5}               # URL 抓取连接超时（秒），防 Slowloris
        max-body-bytes: ${AI_RAG_SSRF_MAX_BODY:10485760}        # 响应体上限 10MB，防 Zip Bomb

    # 记忆子系统配置（会话记忆 JdbcChatMemory + 长期记忆 pgvector + Redis 热缓存/限流）
    # 仅在 enabled=true 时启用记忆路径；否则 ChatService 退化为旧 history 模式。
    # 注意：即便未启用记忆，应用也能正常启动（DB/Redis 不可达不阻断启动）。
    memory:
      enabled: ${AI_MEMORY_ENABLED:true}        # 记忆路径总开关；有数据库/Redis 时持久化到 spring_ai_chat_memory 表
      hot-cache-size: ${AI_MEMORY_HOT_CACHE_SIZE:20}   # Redis 热缓存保留最近 N 条；同时作为记忆检索条数上限
      long-term-top-k: ${AI_MEMORY_LONGTERM_TOP_K:5}    # 长期记忆向量检索 Top-K
      long-term-dedup-enabled: ${AI_MEMORY_LONGTERM_DEDUP:true}   # 落库前向量去重
      long-term-similarity-threshold: ${AI_MEMORY_LONGTERM_THRESHOLD:0.85} # 相似度判重阈值
      long-term-min-content-length: ${AI_MEMORY_LONGTERM_MIN_LEN:15} # 写入/抽取最小字符限制（前置硬规则）
      long-term-summarize-enabled: ${AI_MEMORY_LONGTERM_SUMMARIZE:true} # 开启双重触发摘要抽取
      long-term-summarize-turn-interval: ${AI_MEMORY_LONGTERM_INTERVAL:5} # 摘要抽取对话轮次间隔
      conversation-ttl-days: ${AI_MEMORY_TTL_DAYS:14}  # 会话热缓存在 Redis 的 TTL（天），防止冷数据常驻
      rate-limit:
        enabled: ${AI_MEMORY_RATELIMIT_ENABLED:true}  # Redis 限流开关（默认开启，保护上游配额）；Redis 不可用或判定异常时降级放行，不会阻断业务；同时控制月度配额
        capacity: ${AI_MEMORY_RATELIMIT_CAPACITY:20}   # 窗口内最大请求数
        refill-seconds: ${AI_MEMORY_RATELIMIT_REFILL:60}  # 限流窗口（秒）
      usage-quota:
        monthly-token-quota: ${AI_USAGE_MONTHLY_QUOTA:1000000}  # 用户月度 Token 总量上限（≤0 表示无上限）
        reserve-tokens: ${AI_USAGE_RESERVE_TOKENS:2000}          # 请求发起时预扣基础 token 数（事后按真实值校准）

    # 二等公民：纯 YAML 驱动新增厂商，无需改动 Java 代码。
    # 密钥一律以 ${ENV:占位} 引用；占位值（your_xxx_here）会被识别为未配置而跳过注册。
    second-class:
      # 通义千问：OpenAI 兼容协议（DashScope compatible-mode）
      - id: qwen
        display-name: 通义千问
        protocol: openai
        base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${QWEN_API_KEY:your_qwen_api_key_here}
        models:
          - id: qwen-max
            name: qwen-max
            display-name: 通义千问 Max
            description: 通义千问最强版本
            badge: 推荐
            tags: [chat]
            max-context-tokens: 32768
            default: true
            input-price-per-k: 0.0040
            output-price-per-k: 0.0120
          - id: qwen-plus
            name: qwen-plus
            display-name: 通义千问 Plus
            description: 通义千问性价比版本
            tags: [chat]
            max-context-tokens: 131072
            input-price-per-k: 0.0008
            output-price-per-k: 0.0020

      # 百度千帆：OpenAI 兼容协议（v2 兼容端点）
      - id: qianfan
        display-name: 百度千帆
        protocol: openai
        base-url: ${QIANFAN_BASE_URL:https://qianfan.baidubce.com/v2}
        api-key: ${QIANFAN_API_KEY:your_qianfan_api_key_here}
        models:
          - id: ernie-4.5
            name: ernie-4.5-8k-preview
            display-name: 文心一言 4.5
            description: 百度文心大模型
            tags: [chat]
            max-context-tokens: 8192
            default: true
            input-price-per-k: 0.0040
            output-price-per-k: 0.0120

      # 智谱 GLM：OpenAI 兼容协议
      - id: zhipu
        display-name: 智谱 GLM
        protocol: openai
        base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        api-key: ${ZHIPU_API_KEY:your_zhipu_api_key_here}
        models:
          - id: glm-4
            name: glm-4
            display-name: 智谱 GLM-4
            description: 智谱开源对话模型
            tags: [chat]
            max-context-tokens: 32768
            default: true
            input-price-per-k: 0.0050
            output-price-per-k: 0.0050

      # 自定义协议示例（需自行实现 CustomChatModelSupplier 并注册为名为 baiduNative 的 Bean）
      # - id: baidu-native
      #   display-name: 百度原生 AK/SK
      #   protocol: custom
      #   supplier: baiduNative
      #   api-key: ${BAIDU_API_KEY:your_baidu_api_key_here}
      #   models:
      #             - id: ernie-native
        #       name: ernie-4.0
        #       display-name: 文心 4.0 (原生)
        #       max-context-tokens: 8192
        #       default: true



