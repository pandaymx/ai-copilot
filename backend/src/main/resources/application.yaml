server:
  port: ${SERVER_PORT:${PORT:8084}}

spring:
  config:
    import:
      - optional:file:.env[.properties] # 让 Spring 原生将 .env 解析为 properties 读取
  docker:
    compose:
      lifecycle-management: start-only
      readiness:
        wait: always
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_copilot}
    username: ${POSTGRES_USER:ai}
    password: ${POSTGRES_PASSWORD:ai}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:20000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:3000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:2000ms}
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:${SPRING_AI_DEEPSEEK_API_KEY:your_deepseek_api_key_here}}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-chat}
    openai:
      api-key: ${OPENAI_API_KEY:${SPRING_AI_OPENAI_API_KEY:your_openai_api_key_here}}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        model: ${OPENAI_MODEL:gpt-4o}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:${SPRING_AI_GOOGLE_GENAI_API_KEY:your_gemini_api_key_here}}
        chat:
          model: ${GEMINI_MODEL:gemini-3.6-flash}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3}
    # 会话记忆表（spring_ai_chat_memory）交由 JDBC 记忆 starter 在启动时自动建表；
    # 向量表（ai_long_term_memory）由 pgvector starter 自动建（含 CREATE EXTENSION IF NOT EXISTS vector）。
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        # embedding 由 configured embedding model 提供；会话消息与长期记忆共用同一 pg 实例

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  prometheus:
    metrics:
      export:
        enabled: true


# =====================================================================
# 多模型供应商统一抽象层配置（本模块）
# 与上方 spring.ai.* 解耦：spring.ai.* 负责一等公民的连接与自动装配，
# 这里仅补充展示元数据、上下文预算，并完整描述二等公民。
# =====================================================================
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}  # 生产环境收敛为具体域名列表，如 http://localhost:3000,https://app.yourdomain.com
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:deepseek}
    default-model: ${AI_DEFAULT_MODEL:deepseek-chat}
    system-prompt: "你是一个专业、友好且可靠的 AI 助手。"

    context:
      reserve-output-tokens: 2048        # 为模型输出预留的 token 数
      history-ratio: 0.7                 # 历史消息可占用的上下文预算比例（0~1]
      default-max-context-tokens: 32768  # 模型未声明 maxContextTokens 时的兜底值
      safety-factor: 1.1                 # Token 估算安全系数，>1 表示高估

    # 一等公民：仅需声明「对外暴露哪些模型」及展示元数据。
    # 连接参数（apiKey/baseUrl）仍由上方 spring.ai.* 管理，未配置密钥时由 starter 行为决定。
    first-class:
      deepseek:
        display-name: DeepSeek
        models:
          - id: deepseek-chat
            name: deepseek-chat
            display-name: DeepSeek Chat
            description: DeepSeek 通用对话模型
            badge: 推荐
            tags: [chat]
            max-context-tokens: 32768
            default: true
      openai:
        display-name: OpenAI
        models:
          - id: gpt-4o
            name: gpt-4o
            display-name: GPT-4o
            description: OpenAI 多模态旗舰模型
            tags: [multimodal]
            max-context-tokens: 128000
            default: true
      google:
        display-name: Google Gemini
        models:
          - id: gemini-3.6-flash
            name: gemini-3.6-flash
            display-name: Gemini 3.6 Flash
            description: Google 轻量高速多模态模型（新版）
            tags: [multimodal]
            max-context-tokens: 1048576
            default: true
          - id: gemini-3.5-flash
            name: gemini-3.5-flash
            display-name: Gemini 3.5 Flash
            description: Google 轻量高速多模态模型
            tags: [multimodal]
            max-context-tokens: 1048576
          - id: gemini-3.5-flash-lite
            name: gemini-3.5-flash-lite
            display-name: Gemini 3.5 Flash Lite
            description: Google 轻量低成本多模态模型
            tags: [multimodal]
            max-context-tokens: 1048576
          - id: gemini-3.1-pro-preview
            name: gemini-3.1-pro-preview
            display-name: Gemini 3.1 Pro Preview
            description: Google 旗舰多模态模型预览版
            tags: [multimodal]
            max-context-tokens: 2097152
          - id: gemini-3.1-flash-lite
            name: gemini-3.1-flash-lite
            display-name: Gemini 3.1 Flash Lite
            description: Google 轻量低成本多模态模型
            tags: [multimodal]
            max-context-tokens: 1048576
          - id: gemma-4-26b-a4b-it
            name: gemma-4-26b-a4b-it
            display-name: Gemma 4 26B
            description: Google 开源轻量模型
            tags: [open-source]
            max-context-tokens: 262144
          - id: gemma-4-31b-it
            name: gemma-4-31b-it
            display-name: Gemma 4 31B
            description: Google 开源模型
            tags: [open-source]
            max-context-tokens: 262144
      ollama:
        display-name: Ollama (本地)
        models:
          - id: llama3
            name: llama3
            display-name: Llama 3
            description: 本地运行的开源模型，无需联网密钥
            tags: [local]
            max-context-tokens: 8192
            default: true
      anthropic:
        display-name: Anthropic Claude
        models:
          - id: claude-sonnet-4
            name: claude-sonnet-4-20250514
            display-name: Claude Sonnet 4
            description: Anthropic 旗舰对话模型
            tags: [chat]
            max-context-tokens: 200000
            default: true

    # 记忆子系统配置（会话记忆 JdbcChatMemory + 长期记忆 pgvector + Redis 热缓存/限流）
    # 仅在 enabled=true 时启用记忆路径；否则 ChatService 退化为旧 history 模式。
    # 注意：即便未启用记忆，应用也能正常启动（DB/Redis 不可达不阻断启动）。
    memory:
      enabled: ${AI_MEMORY_ENABLED:true}        # 记忆路径总开关；有数据库/Redis 时持久化到 spring_ai_chat_memory 表
      hot-cache-size: ${AI_MEMORY_HOT_CACHE_SIZE:20}   # Redis 热缓存保留最近 N 条；同时作为记忆检索条数上限
      long-term-top-k: ${AI_MEMORY_LONGTERM_TOP_K:5}    # 长期记忆向量检索 Top-K
      long-term-dedup-enabled: ${AI_MEMORY_LONGTERM_DEDUP:true}   # 落库前向量去重
      long-term-similarity-threshold: ${AI_MEMORY_LONGTERM_THRESHOLD:0.85} # 相似度判重阈值
      long-term-min-content-length: ${AI_MEMORY_LONGTERM_MIN_LEN:15} # 写入/抽取最小字符限制（前置硬规则）
      long-term-summarize-enabled: ${AI_MEMORY_LONGTERM_SUMMARIZE:true} # 开启双重触发摘要抽取
      long-term-summarize-turn-interval: ${AI_MEMORY_LONGTERM_INTERVAL:5} # 摘要抽取对话轮次间隔
      conversation-ttl-days: ${AI_MEMORY_TTL_DAYS:14}  # 会话热缓存在 Redis 的 TTL（天），防止冷数据常驻
      rate-limit:
        enabled: ${AI_MEMORY_RATELIMIT_ENABLED:false}  # Redis 限流开关（默认关闭，避免无 Redis 时阻断）
        capacity: ${AI_MEMORY_RATELIMIT_CAPACITY:20}   # 窗口内最大请求数
        refill-seconds: ${AI_MEMORY_RATELIMIT_REFILL:60}  # 限流窗口（秒）

    # 二等公民：纯 YAML 驱动新增厂商，无需改动 Java 代码。
    # 密钥一律以 ${ENV:占位} 引用；占位值（your_xxx_here）会被识别为未配置而跳过注册。
    second-class:
      # 通义千问：OpenAI 兼容协议（DashScope compatible-mode）
      - id: qwen
        display-name: 通义千问
        protocol: openai
        base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${QWEN_API_KEY:your_qwen_api_key_here}
        models:
          - id: qwen-max
            name: qwen-max
            display-name: 通义千问 Max
            description: 通义千问最强版本
            badge: 推荐
            tags: [chat]
            max-context-tokens: 32768
            default: true
          - id: qwen-plus
            name: qwen-plus
            display-name: 通义千问 Plus
            description: 通义千问性价比版本
            tags: [chat]
            max-context-tokens: 131072

      # 百度千帆：OpenAI 兼容协议（v2 兼容端点）
      - id: qianfan
        display-name: 百度千帆
        protocol: openai
        base-url: ${QIANFAN_BASE_URL:https://qianfan.baidubce.com/v2}
        api-key: ${QIANFAN_API_KEY:your_qianfan_api_key_here}
        models:
          - id: ernie-4.5
            name: ernie-4.5-8k-preview
            display-name: 文心一言 4.5
            description: 百度文心大模型
            tags: [chat]
            max-context-tokens: 8192
            default: true

      # 智谱 GLM：OpenAI 兼容协议
      - id: zhipu
        display-name: 智谱 GLM
        protocol: openai
        base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        api-key: ${ZHIPU_API_KEY:your_zhipu_api_key_here}
        models:
          - id: glm-4
            name: glm-4
            display-name: 智谱 GLM-4
            description: 智谱开源对话模型
            tags: [chat]
            max-context-tokens: 32768
            default: true

      # 自定义协议示例（需自行实现 CustomChatModelSupplier 并注册为名为 baiduNative 的 Bean）
      # - id: baidu-native
