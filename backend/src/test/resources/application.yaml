spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  ai:
    deepseek:
      api-key: test-dummy-deepseek-key
      base-url: http://localhost:8084
    openai:
      api-key: test-dummy-openai-key
      base-url: http://localhost:8084
    google:
      genai:
        api-key: test-dummy-gemini-key
    ollama:
      base-url: http://localhost:11434
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
    vectorstore:
      pgvector:
        initialize-schema: false
