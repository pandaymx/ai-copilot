name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  security-ci:
    name: Security & Vulnerability Scans (Secrets & SAST & Dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Security DB (Semgrep & Trivy)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/semgrep
            ~/.cache/trivy
          key: ${{ runner.os }}-security-db-${{ hashFiles('**/package.json', '**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-security-db-

      - name: Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun for Frontend Audit
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Run Bun Dependency Security Audit
        run: |
          cd frontend
          bun audit

      - name: SAST Code Security Scan (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
          generateSarif: true
          uploadSarif: true

      - name: Trivy Repository Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Trivy FS Scan SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-fs'

  backend-ci:
    name: Backend CI (Build & Test & Docker & Security Scan)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: ai_copilot
          POSTGRES_USER: ai
          POSTGRES_PASSWORD: ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai -d ai_copilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run Backend Unit Tests & Compile
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ai_copilot
          POSTGRES_USER: ai
          POSTGRES_PASSWORD: ai
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          cd backend
          ./gradlew test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Backend Docker Image Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: ai-copilot-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend Docker Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ai-copilot-backend:test'
          format: 'sarif'
          output: 'trivy-backend-image.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Backend Image SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-image.sarif'
          category: 'trivy-backend-image'

  frontend-ci:
    name: Frontend CI (Lint & Typecheck & Test & E2E & Build & Docker & Security Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache: true

      - name: Install Dependencies
        run: |
          cd frontend
          bun install

      - name: Run Biome Lint Check
        run: |
          cd frontend
          bun run lint

      - name: Run TypeScript Typecheck
        run: |
          cd frontend
          bunx tsc --noEmit

      - name: Run Frontend Unit Tests
        run: |
          cd frontend
          bun test src

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium Browser
        run: |
          cd frontend
          bunx playwright install chromium --with-deps

      - name: Run Playwright E2E Tests (Mock Mode)
        run: |
          cd frontend
          bun run test:e2e

      - name: Build Next.js Production App
        run: |
          cd frontend
          bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Frontend Docker Image Build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: ai-copilot-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Frontend Docker Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ai-copilot-frontend:test'
          format: 'sarif'
          output: 'trivy-frontend-image.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Frontend Image SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-image.sarif'
          category: 'trivy-frontend-image'
