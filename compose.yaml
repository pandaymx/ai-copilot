services:
  postgres:
    image: 'pgvector/pgvector:pg18'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai} -d ${POSTGRES_DB:-ai_copilot}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: 'redis:latest'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: 'ollama/ollama:latest'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
    ports:
      - '127.0.0.1:${OLLAMA_HOST_PORT:-11435}:11434'
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:11434/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    ports:
      - '127.0.0.1:8084:8084'
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_BASE_URL: http://ollama:11434
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-your_deepseek_api_key_here}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your_openai_api_key_here}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_api_key_here}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-your_anthropic_api_key_here}
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://otel-collector:4318}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      BACKEND_URL: http://backend:8084/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 统一网关：TLS 终止 (ACME 自动签发/续期) + 反向代理 + 整站 basic_auth 注入 X-User-Id。
  # 替代 nginx + certbot 方案，单容器单 Caddyfile 完成三件事。
  # 前置要求：80/443 端口公网可达，且 CADDY_DOMAIN 的 A 记录指向本机（HTTP 挑战）。
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      - '80:80'
      - '443:443'
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===================== 可观测性监控栈 =====================
  # OpenTelemetry Collector：接收后端 OTLP(traces)，转发至 Tempo
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./monitor/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - '127.0.0.1:4317:4317'   # OTLP gRPC
      - '127.0.0.1:4318:4318'   # OTLP HTTP
      - '127.0.0.1:8889:8889'   # metrics self-monitoring
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8889/metrics || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus：scrape 后端 /actuator/prometheus（含 gen_ai_chat_client_operation_seconds_*）
  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tempo：存储 traces，供 Grafana 查询
  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitor/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - '127.0.0.1:3200:3200'   # Tempo HTTP (查询)
      - '127.0.0.1:4316:4317'   # OTLP gRPC (避免与 collector 4317 冲突)
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana：可视化看板（Prometheus Metrics + Tempo Traces）
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitor/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitor/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3100:3000'   # 避开 frontend 的 3000
    depends_on:
      - prometheus
      - tempo
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  ollama-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  tempo-data:
  grafana-data:
