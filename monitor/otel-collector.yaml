receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # 统一追加服务命名空间，便于在 Tempo 中过滤
  resource:
    attributes:
      - key: deployment.environment
        value: ${DEPLOY_ENV:-local}
        action: upsert

exporters:
  # traces -> Tempo
  otlphttp/tempo:
    endpoint: http://tempo:4318
  # metrics -> Prometheus（拉取模式由 prometheus 自行 scrape；此处不用 push）
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
