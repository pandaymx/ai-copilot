global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 后端 Spring Boot Actuator /actuator/prometheus（暴露 gen_ai_chat_client_operation_seconds_* 等）
  - job_name: ai-copilot-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8084']
        labels:
          service: ai-copilot-backend

  # 监控栈自身
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
