version: '3'

vars:
  COMPOSE_FILE: compose.yaml

tasks:
  default:
    desc: "Start infrastructure in containers + backend & frontend natively (Rootless)"
    cmds:
      - ./start.sh

  dev:
    desc: "Alias for default: launch hybrid dev environment"
    cmds:
      - ./start.sh

  docker:up:
    desc: "Build & launch EVERYTHING in Docker containers (Infra + Backend + Frontend)"
    aliases: [docker]
    cmds:
      - ./start.sh docker

  docker:down:
    desc: "Stop and remove all Docker containers"
    cmds:
      - ./start.sh stop

  infra:
    desc: "Start infrastructure containers only (PostgreSQL, Redis, Ollama)"
    cmds:
      - ./start.sh infra

  infra:down:
    desc: "Stop infrastructure containers"
    aliases: [stop, down]
    cmds:
      - ./start.sh stop

  backend:
    desc: "Start Spring Boot backend standalone"
    dir: backend
    cmds:
      - ./gradlew bootRun

  frontend:
    desc: "Start Next.js frontend standalone"
    dir: frontend
    cmds:
      - bun dev || npm run dev

  status:
    desc: "Check health status of infrastructure containers and listening ports"
    aliases: [ps]
    cmds:
      - ./start.sh status
